<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow">
<title>You're invited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--sf:#0f0f10;--ln:#2a2a2d;--ink:#fff;--mut:#9b9ba3;--pk:#ff2e93;--vi:#8b2bff;--ok:#3ddc97;
--h:Archivo,"Arial Black",Impact,sans-serif;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{height:100%}body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif}
h1,h2,h3,.nm{font-family:var(--h);font-stretch:125%;font-weight:800;margin:0;line-height:1;letter-spacing:-.02em}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 64px}.hide{display:none!important}
button,input,textarea{font:inherit;color:inherit;border-radius:0}button{cursor:pointer}
.link{background:none;border:0;color:var(--mut);padding:10px 0;font-size:14px}
.fl{transition:transform .22s,opacity .22s}.fl.out{transform:perspective(900px) rotateY(85deg);opacity:0}
@media(prefers-reduced-motion:reduce){.fl{transition:none}}
:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
/* picker */
.intro{margin:20px 0 24px}.intro h1{font-size:clamp(30px,8vw,48px)}.intro p{color:var(--mut);margin:12px 0 0}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{text-align:left;background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--pk);padding:24px 20px;color:var(--ink)}
.pick:nth-child(2){border-left-color:var(--vi)}.pick:hover{background:#18181a}
.gv{display:block;color:var(--mut);font-size:13px}.pick .nm{font-size:clamp(24px,5vw,32px);margin:8px 0;display:block;text-wrap:balance}
.fm{display:block;color:var(--mut);font-size:13px}.tag{display:inline-block;margin-top:16px;background:var(--pk);color:#000;font-weight:600;font-size:13px;padding:4px 10px}
.pick:nth-child(2) .tag{background:var(--vi);color:#fff}
.shared{color:var(--mut);font-size:14px;margin-top:20px}
/* card */
.card{background:var(--sf);border:1px solid var(--ln)}
.head{padding:30px 22px 24px;border-bottom:6px solid var(--pk)}.head.v{border-color:var(--vi)}
.head p{margin:0;color:var(--mut);font-size:14px}.head h1{font-size:clamp(46px,13vw,84px);margin:10px 0 8px;color:var(--pk)}.head.v h1{color:#b27bff}
.head .full{color:var(--mut);font-size:13px}.head .tag{margin-top:14px}.head.v .tag{background:var(--vi);color:#fff}
.banner{margin-top:16px;border:1px solid var(--ln);padding:10px 14px;font-size:14px;background:#000}.banner b{color:var(--pk)}
.body{padding:20px}
.kv{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln)}.kv>div{padding:14px 16px}.kv>div+div{border-left:1px solid var(--ln)}
.kv small{color:var(--mut);font-size:13px}.kv b{display:block;font:800 18px var(--h);font-stretch:112%;margin:2px 0}.kv span{color:var(--mut);font-size:13px}
.cdn{margin:12px 0 0;color:var(--pk);font-weight:600;font-size:14px}
.rsvp{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin:16px 0}
.rsvp button{background:#000;border:1px solid var(--ln);padding:14px 6px;font-weight:600;font-size:14px}.rsvp button:first-child{background:var(--pk);border-color:var(--pk);color:#000}
.rsvp button:hover{border-color:var(--pk)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1px solid var(--ln);padding:6px 12px;font-size:13px;color:var(--mut)}
.more{width:100%;margin-top:16px;background:none;border:1px solid var(--vi);color:#c9a3ff;padding:13px;font-weight:600}
.det{margin-top:22px;display:grid;gap:28px}.det h3{font-size:22px;margin-bottom:12px}
.note{color:var(--mut);font-size:14px;margin:0 0 6px}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--ln)}
.tl .t{font-weight:600;color:var(--pk);font-size:14px}.tl .n{font-weight:600}.tl .d{color:var(--mut);font-size:14px}
.loc{border:1px solid var(--ln);padding:18px;background:#000}.loc small{color:var(--vi);font-weight:600;font-size:13px}.loc h4{font:800 22px var(--h);font-stretch:112%;margin:4px 0}.loc p{margin:0 0 12px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row a,.row button{border:1px solid var(--ln);background:var(--sf);padding:9px 13px;font-size:13px;font-weight:600;text-decoration:none;color:var(--ink)}.row .rain{margin-left:auto;background:var(--vi);border-color:var(--vi)}
.know{display:grid;gap:8px}.know div{border:1px solid var(--ln);padding:12px 14px;background:#000}.know b{display:block;font-size:15px}.know span{color:var(--mut);font-size:14px}
/* form */
.form h2{font-size:28px}.sub{color:var(--mut);margin:8px 0 0}.sub b{color:var(--pk)}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}label i{font-style:normal;font-weight:400;color:var(--mut)}
input[type=text],input[type=tel],textarea{width:100%;border:1px solid var(--ln);padding:12px 14px;background:#000}input:focus,textarea:focus{outline:none;border-color:var(--pk)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg button{background:#000;border:1px solid var(--ln);padding:12px 4px;font-weight:600}.seg button.on{border-color:var(--pk);background:var(--pk);color:#000}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--ln);background:#000;padding:6px 6px 6px 14px}.step div{display:flex;align-items:center;gap:12px}
.step button{width:36px;height:36px;border:0;background:var(--vi);color:#fff;font-size:20px;font-weight:700}.step b{min-width:20px;text-align:center}
.whanau{margin:8px 0 0;font-size:12px;color:var(--mut)}.whanau b{color:var(--pk);font-weight:600}
.btn{display:block;width:100%;border:0;background:var(--pk);color:#000;padding:15px;font-weight:700;margin-top:20px;text-align:center;text-decoration:none}
.btn.alt{background:#000;color:var(--ink);border:1px solid var(--vi);margin-top:10px}
.err{color:#ff6b9d;font-size:14px;margin-top:10px}.ok{padding:18px 0 4px}.ok h2{font-size:28px}
.foot{color:var(--mut);font-size:13px;margin-top:24px;text-align:center}
/* host */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.bar button,.bar input,.bar select{background:var(--sf);border:1px solid var(--ln);padding:9px 14px;font-size:13px;font-weight:600;color:var(--mut)}.bar button.on{background:var(--pk);border-color:var(--pk);color:#000}.bar input{flex:1;min-width:140px;font-weight:400;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{background:var(--sf);border:1px solid var(--ln);padding:14px}.stat b{display:block;font:800 34px var(--h);font-stretch:112%;color:var(--pk)}.stat:nth-child(even) b{color:#b27bff}.stat span{color:var(--mut);font-size:12px}
.panel{background:var(--sf);border:1px solid var(--ln);margin-top:14px;padding:6px 16px}.panel h3{font-size:18px;padding:12px 0 0}
.tr{display:grid;grid-template-columns:2fr .8fr .5fr .5fr 2fr auto;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--ln);font-size:14px}.tr:first-of-type{border-top:0}
.tr small{display:block;color:var(--mut);font-size:12px}.tr.new{box-shadow:inset 4px 0 var(--pk);padding-left:12px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;display:inline-block}.y{background:var(--pk);color:#000}.m{background:var(--vi)}.n{background:#333;color:#ccc}
.cb{font-size:11px;padding:1px 7px;margin-left:6px;background:var(--vi);font-weight:600}.cb.h{background:var(--pk);color:#000}
.x{background:none;border:0;color:var(--mut);font-size:18px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-150px);background:var(--pk);color:#000;font-weight:700;padding:14px 20px;z-index:9;transition:transform .35s;max-width:92vw}#toast.show{transform:translate(-50%,0)}
@media(max-width:640px){.picks{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv>div+div{border-left:0;border-top:1px solid var(--ln)}.rsvp{grid-template-columns:1fr 1fr}.rsvp button:first-child{grid-column:1/-1}
.stats{grid-template-columns:1fr 1fr}.tr{grid-template-columns:1fr auto}.tr>:nth-child(3),.tr>:nth-child(4){display:none}}

/* ---- v5: rounded, soft pink-violet gradient, one corporate typeface (Inter) ---- */
:root{--pv:linear-gradient(135deg,#ff2e93,#8b2bff);--pvl:linear-gradient(135deg,#ff6bb5,#b88aff);--h:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.nm,.kv b,.loc h4,.stat b{font-stretch:100%;letter-spacing:-.03em;font-weight:700}
button,input,textarea{border-radius:12px}
.pick{border-left:1px solid var(--ln);border-radius:24px;background:radial-gradient(circle at 100% 0,rgba(139,43,255,.24),transparent 55%),radial-gradient(circle at 0 100%,rgba(255,46,147,.2),transparent 55%),var(--sf)}
.pick:hover{border-color:var(--pk);background:radial-gradient(circle at 100% 0,rgba(139,43,255,.3),transparent 55%),radial-gradient(circle at 0 100%,rgba(255,46,147,.26),transparent 55%),var(--sf)}
.tag,.pick:nth-child(2) .tag,.head.v .tag{background:var(--pv);color:#fff;border-radius:99px;padding:5px 14px}
.card{border-radius:28px;overflow:hidden}
.head,.head.v{border-bottom:1px solid var(--ln);background:radial-gradient(circle at 8% 0,rgba(255,46,147,.42),transparent 50%),radial-gradient(circle at 96% 8%,rgba(139,43,255,.48),transparent 50%),#000}
.head h1,.head.v h1{background:var(--pvl);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-weight:800}
.banner{border-radius:14px;background:rgba(0,0,0,.55)}.kv{border-radius:18px;overflow:hidden}
.rsvp button{border-radius:14px}.rsvp button:first-child{background:var(--pv);border:0;color:#fff;box-shadow:0 8px 24px rgba(255,46,147,.3)}
.chips span{border-radius:99px}.more{border-radius:14px}.loc{border-radius:20px}.row a,.row button{border-radius:10px}.row .rain{background:var(--pv);border:0}.know div{border-radius:14px}
.seg button{border-radius:12px}.seg button.on{background:var(--pv);border-color:transparent;color:#fff}
.step{border-radius:12px;padding:6px 8px 6px 14px}.step button{border-radius:50%;background:var(--pv)}
.btn{border-radius:14px;background:var(--pv);color:#fff;box-shadow:0 8px 24px rgba(255,46,147,.3)}.btn.alt{background:#000;border:1px solid var(--vi);box-shadow:none}
.bar button,.bar input,.bar select{border-radius:99px}.bar button.on{background:var(--pv);border-color:transparent;color:#fff}
.stat{border-radius:18px}.panel{border-radius:22px}.pill,.cb{border-radius:99px}.y{background:var(--pv);color:#fff}.cb.h{background:var(--pk);color:#000}
#toast{border-radius:16px;background:var(--pv);color:#fff}.tr.new{box-shadow:inset 3px 0 var(--pk)}

/* ---- v6: fun + iPhone ---- */
:root{--h:Poppins,Inter,system-ui,-apple-system,sans-serif}
html{-webkit-text-size-adjust:100%}body{min-height:100dvh;-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3,.nm,.kv b,.loc h4,.stat b{font-weight:700;letter-spacing:-.02em}
.head{position:relative}.head h1{font-size:clamp(34px,9.5vw,72px);font-weight:800;overflow-wrap:anywhere}
.head:before,.head:after{position:absolute;top:16px;font-size:26px;animation:fy 4s ease-in-out infinite}.head:before{content:"🎈";left:18px}.head:after{content:"🎉";right:18px;animation-delay:1.2s}
@keyframes fy{50%{transform:translateY(-8px)}}
.tl{position:relative}.tl li{grid-template-columns:44px 1fr;gap:14px;padding:10px 0;border:0;position:relative}
.tl li:not(:last-child):before{content:"";position:absolute;left:21px;top:54px;bottom:-4px;width:2px;border-radius:2px;background:linear-gradient(var(--pk),var(--vi));opacity:.5}
.ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:21px;border:2px solid transparent;background:linear-gradient(#000,#000) padding-box,var(--pv) border-box}
.tl .t{font-size:13px;color:#ff6bb5;font-weight:700}
.chips span{background:rgba(255,255,255,.04);color:#e8e8ee}
.rsvp button,.seg button,.btn,.more,.row a,.row button{min-height:48px}.link{min-height:44px}
.step button{width:44px;height:44px}input[type=text],input[type=tel],input[type=password],textarea{min-height:48px;font-size:16px}
.sticky{display:none}
@media(max-width:640px){.sticky:not(.hide){display:block;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:28px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 45%)}
.sticky button{width:100%;min-height:52px;border:0;color:#fff;font-weight:700;font-size:16px;background:var(--pv);border-radius:16px;box-shadow:0 8px 28px rgba(255,46,147,.4)}
.body{padding:18px}.head{padding:34px 18px 22px}.kv b{font-size:17px}.intro h1{font-size:30px}}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}.cf i{position:absolute;top:-16px;width:9px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){.head:before,.head:after{animation:none}}
.lh{display:flex;justify-content:space-between;align-items:center}.flipbtn{width:44px;height:44px;border:0;border-radius:50%;background:var(--pv);color:#fff;font-size:22px;font-weight:700;line-height:1;box-shadow:0 6px 18px rgba(255,46,147,.35)}
.loc .hint{margin:12px 0 0;font-size:12px;color:var(--mut)}.loc .row{margin-top:12px}

/* ---- v7: codes, always-on info, more motion ---- */
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.bg span{position:absolute;bottom:-60px;opacity:.3;animation:rise linear infinite}
@keyframes rise{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-120vh) rotate(12deg)}}
.wrap{position:relative;z-index:1}
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.9,.3,1.2);transition-delay:calc(var(--i,0)*70ms)}.rv.in{opacity:1;transform:none}
.stack{display:grid;gap:14px;margin-top:14px}.stack h3{margin-bottom:12px}
.codein{text-align:center;font:700 26px Poppins,sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:16px}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(14px)}}
.head>*{animation:pop .7s both}.head>*:nth-child(2){animation-delay:.1s}.head>*:nth-child(3){animation-delay:.2s}.head>*:nth-child(4){animation-delay:.3s}.head>*:nth-child(5){animation-delay:.4s}
.head h1{background-size:200% 200%;animation:pop .7s .1s both,gs 6s ease-in-out infinite}@keyframes gs{50%{background-position:100% 50%}}
.rsvp button:first-child,.btn,.sticky button{position:relative;overflow:hidden}
.rsvp button:first-child:after,.btn:not(.alt):after,.sticky button:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);animation:sh 3.2s ease-in-out infinite}
@keyframes sh{60%,100%{left:130%}}
.rsvp button:first-child,.sticky button{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 8px 38px rgba(255,46,147,.7)}}
.ic{animation:bob 3s ease-in-out infinite}.tl li:nth-child(even) .ic{animation-delay:.7s}@keyframes bob{50%{transform:translateY(-4px) rotate(6deg)}}
.chips span{transition:transform .2s}.chips span:hover{transform:translateY(-3px) rotate(-2deg)}
.status{border-radius:18px;padding:14px 16px;margin-top:16px;background:rgba(255,255,255,.05);border:1px solid var(--ln);animation:pop .5s both}.status b{display:block;font-size:16px}.status span{color:var(--mut);font-size:14px}
.rsvp.two{grid-template-columns:1.5fr 1fr}
.calrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.calrow .btn{margin:0;padding:12px 8px;font-size:14px;display:flex;align-items:center;justify-content:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s}
.sheetin{width:100%;max-width:520px;background:var(--sf);border:1px solid var(--ln);border-radius:28px 28px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:slide .35s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateY(100%)}}
.cbtn{display:flex;align-items:center;min-height:52px;border:1px solid var(--ln);border-radius:14px;padding:0 16px;margin-top:10px;text-decoration:none;color:var(--ink);font-weight:600;background:#000}
.gr{display:grid;grid-template-columns:2fr 1fr 1.3fr auto auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--ln);font-size:14px}.gr code{font:600 14px ui-monospace,Menlo,monospace;letter-spacing:.08em;color:#ff6bb5}
.panel textarea{margin:10px 0}.panel .row2{margin:10px 0}
@media(min-width:641px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.gr{grid-template-columns:1fr auto auto}.gr>:nth-child(2){display:none}.rsvp.two button:first-child{grid-column:auto}.calrow{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ---- v8: majestic landing, crest, admin preview ---- */
.landing{min-height:calc(100dvh - 70px);display:flex;align-items:center;justify-content:center;text-align:center}
.royal{position:relative;width:100%;max-width:440px;padding:8px 0 24px}
.royal:before{content:"";position:absolute;left:50%;top:-30px;width:460px;height:460px;max-width:140vw;transform:translateX(-50%);background:radial-gradient(circle,rgba(217,174,58,.2),transparent 62%);animation:breathe 6s ease-in-out infinite;z-index:-1}
@keyframes breathe{50%{opacity:.5;transform:translateX(-50%) scale(1.1)}}
.crest{position:relative;width:clamp(190px,56vw,260px);margin:0 auto;animation:crestin 1.5s cubic-bezier(.2,.8,.2,1) both}
.crest img{width:100%;display:block;filter:drop-shadow(0 0 28px rgba(217,174,58,.38))}
.shine{position:absolute;inset:0;-webkit-mask:var(--crest) center/contain no-repeat;mask:var(--crest) center/contain no-repeat;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);background-size:260% 100%;background-position:160% 0;animation:sweep 5.5s 1.8s ease-in-out infinite}
@keyframes sweep{0%{background-position:160% 0}45%,100%{background-position:-60% 0}}
@keyframes crestin{from{opacity:0;transform:scale(.86) translateY(20px);filter:blur(8px)}}
.over{margin:22px 0 0;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#d9b45a;animation:pop .9s .5s both}
.reg{font:700 clamp(30px,8.4vw,44px)/1.08 Poppins,sans-serif;letter-spacing:-.02em;margin:12px 0 0;animation:pop .9s .7s both}
.rule{display:flex;align-items:center;gap:14px;color:#d9b45a;margin:18px auto 0;max-width:240px;animation:pop .9s .85s both}
.rule span{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9a24a)}.rule span:last-child{background:linear-gradient(270deg,transparent,#c9a24a)}
.lead{color:var(--mut);margin:14px 0 0;animation:pop .9s .95s both}
.entry{margin-top:22px;text-align:left;padding:2px 18px 20px;border:1px solid rgba(201,162,74,.38);border-radius:24px;background:rgba(255,255,255,.04);backdrop-filter:blur(8px);animation:pop .9s 1.1s both}
.tw{position:absolute;font-style:normal;color:#e6c46a;font-size:16px;animation:twk 3s ease-in-out infinite}@keyframes twk{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}
.mini{width:46px;display:block;margin:0 auto 10px;filter:drop-shadow(0 0 10px rgba(217,174,58,.35))}
.foot .mini{width:40px;margin-bottom:8px}
.adm{position:sticky;top:max(6px,env(safe-area-inset-top));z-index:12;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);border:1px solid var(--vi);border-radius:16px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.adm b{margin-right:auto}.adm button,.adm a{border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:6px 11px;border-radius:99px;font-size:12px;font-weight:600;text-decoration:none;min-height:32px;display:inline-flex;align-items:center}.adm .on{background:var(--pv);border-color:transparent}

/* ---- v9: wax seal ---- */
.royal:before{width:360px;height:360px;top:-60px;background:radial-gradient(circle,rgba(255,46,147,.17),transparent 62%)}
.seal{position:relative;width:clamp(124px,36vw,158px);aspect-ratio:1;margin:6px auto 0;filter:drop-shadow(0 14px 16px rgba(0,0,0,.75)) drop-shadow(0 0 30px rgba(255,46,147,.2));animation:stamp 1.4s cubic-bezier(.2,.9,.25,1.1) both}
.seal svg{position:absolute;inset:0;width:100%;height:100%}
.imp{position:absolute;left:22%;top:20%;width:56%;height:56%;-webkit-mask:var(--crest) center/contain no-repeat;mask:var(--crest) center/contain no-repeat}
.imp.a{background:rgba(255,175,210,.6);transform:translate(1.3px,1.3px)}.imp.b{background:rgba(35,0,18,.8);transform:translate(-1.3px,-1.3px)}.imp.c{background:linear-gradient(145deg,#8a1048,#c01a66)}

.over{margin-top:26px}

/* ---- v10: cinematic intro ---- */
.cine{position:fixed;inset:0;z-index:60;background:#000;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;transition:opacity .5s}
.cine.on{opacity:1}.cine.out{opacity:0;filter:blur(14px);transform:scale(1.06);transition:opacity 1.3s ease,filter 1.3s ease,transform 1.3s ease;pointer-events:none}
.cine:before{content:"";position:absolute;width:560px;height:560px;max-width:150vw;border-radius:50%;background:radial-gradient(circle,rgba(var(--g),.3),transparent 62%);opacity:0}
.cine.play:before{animation:cg 5s ease-in-out both}@keyframes cg{0%{opacity:0;transform:scale(.7)}40%,75%{opacity:1;transform:scale(1)}100%{opacity:.6;transform:scale(1.25)}}
.cine>div{position:relative}.cine p,.cine .c4{opacity:0}
.cine .c1{margin:0;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#d9b45a}.cine .c2{margin:10px 0 0;color:var(--mut)}
.cine h1{font:800 clamp(30px,10.5vw,92px)/1 Poppins,sans-serif;margin:16px 0 10px;letter-spacing:-.03em;white-space:nowrap}.cine>div{max-width:100%}
.cine .l{display:inline-block;opacity:0}
.cine .c4{display:inline-block;background:var(--pv);color:#fff;border-radius:99px;padding:9px 24px;font-weight:700;font-size:18px;box-shadow:0 8px 30px rgba(255,46,147,.4)}
.cine.play .c1{animation:fi 1.1s .3s both}.cine.play .c2{animation:fi 1.1s .9s both}
.cine.play .l{animation:ltr .9s var(--d) both cubic-bezier(.2,.8,.2,1)}
.cine.play .c4{animation:tp .9s 3s both cubic-bezier(.2,1.3,.3,1)}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ltr{from{opacity:0;filter:blur(14px);transform:translateY(18px) scale(1.25)}to{opacity:1;filter:none;transform:none}}

.cine .skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;font-size:12px;color:var(--mut);opacity:.55}

function show(n){["code","inv"].forEach(v=>$("#"+v).classList.toggle("hide",v!==n));$("#back").classList.toggle("hide",n!=="inv");$("#sticky").classList.toggle("hide",n!=="inv");$("#bg").style.display=n==="code"?"none":"block";scrollTo(0,0);reveal()}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),5000)}
$("#bg").innerHTML=["🎈","🎉","✨","💖","🎈","🦄","🎊","✨"].map((e,i)=>`<span style="left:${(i*13+5)%92}%;animation-duration:${16+i*2.5}s;animation-delay:-${i*3}s;font-size:${22+i%3*8}px">${e}</span>`).join("");

/* ---- code entry ---- */
$("#cd").oninput=e=>{const v=norm(e.target.value).slice(0,8);e.target.value=fmt(v).replace(/-$/,"")};
$("#cd").onkeydown=e=>{if(e.key==="Enter")$("#cgo").click()};
$("#cgo").onclick=()=>openCode($("#cd").value);
async function openCode(raw,silent){const c=norm(raw||""),ce=$("#ce");ce.classList.add("hide");
 const fail=m=>{if(silent)return;ce.textContent=m;ce.classList.remove("hide");$("#cd").classList.add("shake");setTimeout(()=>$("#cd").classList.remove("shake"),500)};
 if(!sb)return fail("This invitation isn't connected yet.");if(c.length<8)return fail("Codes have 8 letters and numbers, like ABCD-2345.");
 $("#cgo").disabled=true;const {data}=await sb.rpc("get_invite",{p_code:c});$("#cgo").disabled=false;
 if(!data){try{localStorage.removeItem(KEY)}catch(e){}return fail("We couldn't find that code. Check your invitation and try again.")}
 try{localStorage.setItem(KEY,c)}catch(e){}EV={...CFG.DEFAULT,...(data.content||{})};G={...data,code:c};silent?openInv():cinematic()}
$("#back").onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}G=null;history.replaceState(null,"",location.pathname);flip($("#inv"),()=>{$("#cd").value="";show("code")})};

/* ---- calendar ---- */
const z=d=>d.toISOString().replace(/[-:]|\.\d{3}/g,""),loc=()=>EV.venue.n+", "+EV.venue.a;
const gcal=()=>`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${q("Shared Birthday Party: "+EV.children.map(c=>`${c.short} (${c.age})`).join(" & "))}&dates=${z(new Date(EV.start))}/${z(new Date(EV.end))}&location=${q(loc())}&details=${q("Doors open "+EV.doors+". Rain plan: "+EV.rain.n+", "+EV.rain.a)}`;
const cal=()=>`<a class="btn alt" href="party.ics">🍎 Apple Calendar</a><a class="btn alt" target="_blank" rel="noopener" href="${gcal()}">📅 Google Calendar</a>`;

/* ---- invitation ---- */
function openInv(){const f=fam(),A=EV.children[0],B=EV.children[1],cur=f?A:C(G.child),o=f?B:oth(G.child),v=!f&&idx(G.child)?" v":"";
 document.title=f?`You're invited: ${A.short} & ${B.short}'s birthday`:`You're invited: ${cur.short}'s birthday`;
 $("#head").className="head"+(f?" fam":v);
 $("#head").innerHTML=`<img class="mini" src="${CREST}" alt="">`+(f?
  `<p>${T(EV.family.kicker)}<br>You're invited to celebrate</p><div class="twoname"><h1 class="n1">${esc(A.short)}</h1><span class="amp">&amp;</span><h1 class="n2">${esc(B.short)}</h1></div><div class="tags"><span class="tag">Turning ${A.age} 🎂</span><span class="tag">Turns ${B.age} 🎂</span></div><div class="banner">${T(EV.family.note)}</div>`
  :`<p>${T(EV.greeting)}<br>You're invited to celebrate</p><h1>${esc(cur.short)}</h1><div class="full">${esc(cur.given)} ${esc(cur.maori)} ${esc(cur.family)}</div><span class="tag">Turns ${cur.age} 🎂</span><div class="banner">🎈 <b>Shared birthday party</b> with ${esc(o.short)}, who also turns ${o.age}.</div>`);
 $("#kv").innerHTML=`<div><small>When</small><b>${esc(EV.date.replace(/ \d{4}$/,""))}</b><span>Doors open ${esc(EV.doors)}</span></div><div><small>Where</small><b>${esc(EV.venue.n)}</b><span>${esc(EV.venue.a)}</span></div>`;
 $("#chips").innerHTML=EV.chips.map(c=>`<span>${T(c)}</span>`).join("");$("#allday").textContent=fill(EV.allday);
 $("#tl").innerHTML=EV.plan.map((i,n)=>`<li class="rv" style="--i:${n%4}"><div class="ic">${esc(i[3]||"🎈")}</div><div><div class="t">${esc(i[0])}</div><div class="n">${T(i[1])}</div><div class="d">${T(i[2])}</div></div></li>`).join("");
 $("#know").innerHTML=EV.know.map(k=>`<div><b>${T(k[0])}</b><span>${T(k[1])}</span></div>`).join("");
 loc2(false);$("#det").classList.add("hide");$("#more").textContent="See the full day plan";
 $("#front").classList.remove("hide");$("#rc").classList.add("hide");renderRsvp();tick();show("inv")}
function renderRsvp(){const r=G.rsvp,st=$("#status"),row=$("#rsvpRow");
 if(r){const tx=r.status==="yes"?`🎉 You're coming: ${r.adults} adult${r.adults==1?"":"s"}, ${r.kids} kid${r.kids==1?"":"s"}`:r.status==="maybe"?"🤔 You've replied: maybe":"💜 You've replied: can't make it";
  st.innerHTML=`<b>${tx}</b><span>Thanks ${esc(r.parent_name)}. You can change your RSVP any time.</span>`+(r.status==="no"?"":`<div class="calrow">${cal()}</div>`);st.classList.remove("hide");
  row.className="rsvp two";row.innerHTML=`<button data-a="c">💬 Contact us</button><button data-a="e">✏️ Change my RSVP</button>`;$("#sticky button").textContent="💬 Contact us"}
 else{st.classList.add("hide");row.className="rsvp";row.innerHTML=`<button data-v="yes">🎉 Count us in</button><button data-v="maybe">🤔 Maybe</button><button data-v="no">😢 Can't make it</button>`;$("#sticky button").textContent="🎉 RSVP now"}
 row.querySelectorAll("button").forEach(b=>b.onclick=()=>b.dataset.a==="c"?openSheet():openForm(b.dataset.v||r.status))}
$("#sticky button").onclick=()=>G&&G.rsvp?openSheet():openForm("yes");
function loc2(rain){const p=rain?EV.rain:EV.venue,a=p.n+", "+p.a;
 $("#loc").innerHTML=`<div class="lh"><small>${rain?"🌧 Rain plan":"☀️ Fine weather"}</small><button class="flipbtn" id="rb" aria-label="Flip card to see the ${rain?"fine weather location":"rain plan"}">↻</button></div><h4>${esc(p.n)}</h4><p>${esc(p.a)}${rain?"<br>If the weather turns, the party moves indoors.":""}</p><div class="row"><a target="_blank" rel="noopener" href="https://maps.apple.com/?q=${q(a)}">Apple Maps</a><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q(a)}">Google Maps</a></div><p class="hint">Tap the arrow to flip to the ${rain?"fine weather location":"rain plan"}</p>`;
 $("#rb").onclick=()=>flip($("#loc"),()=>loc2(!rain))}
$("#more").onclick=()=>{const d=$("#det");d.classList.toggle("hide");$("#more").textContent=d.classList.contains("hide")?"See the full day plan":"Hide the day plan";reveal()};
function tick(){const ms=new Date(EV.start)-Date.now();$("#cdn").textContent=ms<=0?"🎉 It's party time":`⏳ ${Math.floor(ms/864e5)} days, ${Math.floor(ms/36e5)%24} hours to go`}setInterval(()=>{if(G)tick()},30000);

/* ---- contact sheet ---- */
function contactHtml(){const c=G.contact||EV.contact||{},ppl=c.people||[];let h=`<p class="sub" style="margin-bottom:4px">${T(c.name||"We're happy to help with anything.")}</p>`;
 ppl.forEach(p=>{const n=(p.phone||"").replace(/[^+\d]/g,"");if(n)h+=`<div class="cpair"><a class="cbtn" href="tel:${n}">📞 ${esc(p.name)} · ${esc(p.phone)}</a><a class="cbtn" href="sms:${n}" aria-label="Text ${esc(p.name)}">💬</a></div>`});
 if(c.email)h+=`<a class="cbtn" href="mailto:${esc(c.email)}">✉️ ${esc(c.email)}</a>`;
 if(!ppl.length&&!c.email)h+=`<p class="sub">The hosts will be in touch soon.</p>`;return h}
function openSheet(){$("#sheetin").innerHTML=`<h3 style="margin-bottom:6px">Contact us</h3>${contactHtml()}<button class="link" id="sx" style="width:100%;margin-top:10px">Close</button>`;$("#sheet").classList.remove("hide");$("#sx").onclick=()=>$("#sheet").classList.add("hide")}
$("#sheet").onclick=e=>{if(e.target.id==="sheet")$("#sheet").classList.add("hide")};

/* ---- RSVP card ---- */
const st={v:"yes",a:1,k:1};
const setV=v=>{st.v=v;$$("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));$("#extra").classList.toggle("hide",v==="no")};
function openForm(v){const f=fam(),A=EV.children[0],B=EV.children[1],cur=f?A:C(G.child),o=f?B:oth(G.child),r=G.rsvp||{};setV(v);
 st.a=r.adults||1;st.k=r.kids||1;$("#va").textContent=st.a;$("#vk").textContent=st.k;
 $("#pn").value=r.parent_name||"";$("#cn").value=f?(r.child_name&&r.child_name!=="Whānau"?r.child_name:""):G.label;$("#cn").readOnly=!f;$("#cn").classList.toggle("locked",!f);$("#di").value=r.diet||"";$("#ph").value=r.phone||"";$("#nt").value=r.note||"";
 $("#lblcn").textContent=f?"Names of tamariki coming (optional)":"Child's name";
 $("#fT").textContent=(G.rsvp?"Update RSVP":"RSVP")+(f?" · Whānau":" for "+cur.short);
 $("#fS").innerHTML=f?`A shared birthday celebration for <b>${esc(A.short)}</b> and <b>${esc(B.short)}</b>.`:`Turns ${cur.age}. <b>Shared party</b> with ${esc(o.short)}, who turns ${o.age}.`;
 $("#sticky").classList.add("hide");$("#err").classList.add("hide");
 flip($("#inv"),()=>{$("#front").classList.add("hide");$("#rc").classList.remove("hide");$("#form").classList.remove("hide");$("#done").classList.add("hide");scrollTo(0,0)})}
const toFront=()=>flip($("#inv"),()=>{$("#sticky").classList.remove("hide");$("#rc").classList.add("hide");$("#front").classList.remove("hide");scrollTo(0,0);reveal()});
$("#fb").onclick=toFront;$("#vi").onclick=toFront;
$$("#seg button").forEach(b=>b.onclick=()=>setV(b.dataset.v));
$$(".step button").forEach(b=>b.onclick=()=>{const k=b.dataset.s;st[k]=Math.max(0,Math.min(20,st[k]+ +b.dataset.d));$("#v"+k).textContent=st[k]});
$("#send").onclick=async()=>{const f=fam(),p=$("#pn").value.trim(),k=$("#cn").value.trim()||(f?"Whānau":""),err=$("#err");err.classList.add("hide");
 if(!p||!k){err.textContent=f?"Add your name.":"Add the parent's name and the child's name.";err.classList.remove("hide");return}
 const no=st.v==="no",pv=G.preview;$("#send").disabled=true;$("#send").textContent="Sending…";
 const {data,error}=pv?{data:true}:await sb.rpc("submit_rsvp",{p_code:G.code,p_parent:p,p_child_name:k,p_status:st.v,p_adults:no?0:st.a,p_kids:no?0:st.k,p_diet:no?null:$("#di").value.trim()||null,p_phone:$("#ph").value.trim()||null,p_note:$("#nt").value.trim()||null});
 $("#send").disabled=false;$("#send").textContent="Send RSVP";
 if(error||!data){err.textContent="That didn't send. Please check your connection and try again.";err.classList.remove("hide");return}
 if(pv){G.rsvp={parent_name:p,child_name:k,status:st.v,adults:no?0:st.a,kids:no?0:st.k}}else{const r=await sb.rpc("get_invite",{p_code:G.code});if(r.data)G={...r.data,code:G.code}}renderRsvp();
 $("#form").classList.add("hide");$("#done").classList.remove("hide");scrollTo(0,0);
 $("#dT").textContent=no?"Thanks for letting us know 💜":"You're on the list 🎉";
 $("#dS").textContent=no?"We'll miss you. Change your mind? Just come back with your code.":`See you on ${EV.date}. Come back with your code any time to change your RSVP.`;
 $("#dcal").innerHTML=no?"":cal();$("#dcon").innerHTML=`<h3 style="margin:20px 0 4px">Need to reach us?</h3>`+contactHtml();
 if(!no)confetti()};
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const w=document.createElement("div");w.className="cf";const c=["#ff2e93","#8b2bff","#fff","#ff6bb5","#b88aff"];for(let i=0;i<60;i++){const e=document.createElement("i");e.style.cssText=`left:${Math.random()*100}%;background:${c[i%5]};animation-delay:${Math.random()*.6}s;animation-duration:${1.8+Math.random()*1.4}s`;w.appendChild(e)}document.body.appendChild(w);setTimeout(()=>w.remove(),4000)}

/* ---- cinematic intro (family invitations show both names, equally) ---- */
function cinematic(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return openInv();
 const f=fam(),list=f?[EV.children[0],EV.children[1]]:[C(G.child)],el=$("#cine"),a=[255,107,181],b=[184,138,255];
 try{document.activeElement.blur()}catch(e){}
 el.className="cine";el.style.setProperty("--g",f?"190,70,230":idx(G.child)?"139,43,255":"255,46,147");
 const nm=(c,base)=>{const n=[...c.short];return `<h1>${n.map((ch,i)=>{const t=i/Math.max(1,n.length-1),k=a.map((v,j)=>Math.round(v+(b[j]-v)*t));return `<span class="l" style="--d:${(base+i*.07).toFixed(2)}s;color:rgb(${k})">${ch===" "?"&nbsp;":esc(ch)}</span>`}).join("")}</h1>`};
 const last=1.6+(list.length-1)*1.1+.9,tags=list.map((c,i)=>`<span class="c4" style="animation-delay:${(last+.2+i*.25).toFixed(2)}s">Turns ${c.age} 🎂</span>`).join(" ");
 el.innerHTML=`<div><p class="c1">${T(f?EV.family.kicker:EV.greeting)}</p><p class="c2">You're invited to celebrate</p>${list.map((c,i)=>nm(c,1.6+i*1.1)).join("")}${tags}</div><div class="skip">Tap to skip</div>`;
 $$("#cine h1").forEach(h=>{const m=Math.min(innerWidth,1000)-48;if(h.scrollWidth>m)h.style.fontSize=parseFloat(getComputedStyle(h).fontSize)*m/h.scrollWidth+"px"});
 (cinematic.t||[]).forEach(clearTimeout);const Tm=cinematic.t=[];let opened=false,ended=false;
 const open=()=>{if(!opened){opened=true;openInv()}},end=()=>{if(ended)return;ended=true;open();el.classList.add("out");Tm.push(setTimeout(()=>{el.className="cine hide";el.innerHTML=""},1350))};
 const total=(last+3.5)*1000;Tm.push(setTimeout(()=>el.classList.add("on","play"),30),setTimeout(open,total-300),setTimeout(end,total));el.onclick=end}

/* ---- live preview from admin.html (same-origin only; renders whatever content it is sent, nothing else) ---- */
addEventListener("message",e=>{if(e.origin!==location.origin||!e.data)return;const d=e.data;
 if(d.type==="ormsby-preview"){EV={...CFG.DEFAULT,...d.content};G={label:d.label||"Mia",child:d.child,party:EV.party,rsvp:null,contact:EV.contact,code:"PREVIEW0",preview:true};openInv()}
 if(d.type==="ormsby-intro"&&G)cinematic()});
if(PREVIEW){document.body.classList.add("pv");show("inv");parent.postMessage({type:"ormsby-ready"},location.origin)}
else{let c=new URLSearchParams(location.search).get("code");try{c=c||localStorage.getItem(KEY)}catch(e){}show("code");if(c)openCode(c,true)}
</script></body></html>
